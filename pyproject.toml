[project]
name = "cited-answers"
version = "0.1.0"
description = "Question answering over the EU AI Act and GDPR that cites the article for every claim and refuses when no source supports an answer."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
# Author metadata is left out until the owner decides it.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "langgraph>=1.0",
    "numpy>=1.26",
    "psycopg[binary]>=3.2",
    "snowballstemmer>=2.2",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
gemini = ["google-genai>=1.0"]
ingest = ["beautifulsoup4>=4.12", "lxml>=5.2"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
]
# Local-only: a pip-installable PostgreSQL 16 with pgvector, used by the integration
# tests when no DATABASE_URL is given (CI uses a pgvector service container instead).
localpg = ["pgserver>=0.1.4"]

[project.scripts]
cited-answers = "cited_answers.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cited_answers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "pg: needs PostgreSQL with pgvector (CA_TEST_DATABASE_URL, or the local pgserver group)",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # legal text uses typographic quotes on purpose

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
packages = ["cited_answers"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true

# Local PostgreSQL 17 with pgvector, bound to localhost only.
# Use with: CA_STORE=pgvector CA_DATABASE_URL=postgresql://cited:cited@127.0.0.1:5432/cited
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: cited
      POSTGRES_PASSWORD: cited  # local development only
      POSTGRES_DB: cited
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cited"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
